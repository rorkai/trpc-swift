[default]
locale = "en-gb"

[files]
ignore-hidden = false
extend-exclude = [".git", "node_modules", "pnpm-lock.yaml"]

# GitHub Actions event activity types, which must keep their US spelling.
[default.extend-identifiers]
labeled = "labeled"
unlabeled = "unlabeled"
# Platform and protocol identifiers in the generated client: Foundation's
# JSONSerialization and Error.localizedDescription, the HTTP Authorization
# header and tRPC's UNAUTHORIZED error code.
JSONSerialization = "JSONSerialization"
localizedDescription = "localizedDescription"
Authorization = "Authorization"
UNAUTHORIZED = "UNAUTHORIZED"
