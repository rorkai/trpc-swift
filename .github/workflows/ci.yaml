name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yaml for tagpr's release PR.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-
      # Includes the treefmt check that treefmt-nix's flake module adds.
      - run: nix flake check

  test:
    name: test
    # The fixture tests compile the generated Swift, which needs Xcode's iOS SDK.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-
      # Install first: the task cache is restored afterwards because installing can
      # rewrite node_modules, where the cache lives.
      - run: nix develop --command just install
      # vp fingerprints the files each task reads, so the key only separates runners
      # and each run saves a fresh entry; the newest earlier one is restored.
      - name: Restore Vite+ task cache
        id: vp-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vp-task-${{ runner.os }}-${{ runner.arch }}-
      - run: nix develop --command just check test
      - name: Save Vite+ task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vp-task-cache.outputs.cache-primary-key }}

  linux:
    name: swift linux
    # The generated file must also build for server-side Swift, where URLSession lives in FoundationNetworking.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each fixture's committed output is a whole generated file, so each is type-checked on its own.
      - name: Type-check the generated Swift on Linux
        run: |
          for file in tests/*/Output.swift; do
            echo "::group::$file"
            swiftc -swift-version 6 -warnings-as-errors -typecheck "$file"
            echo "::endgroup::"
          done
