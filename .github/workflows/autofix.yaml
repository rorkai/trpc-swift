name: autofix.ci

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rorkai/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          github-token: ${{ github.token }}
      - run: nix develop --command just install
      # Unfixable errors are reported by the CI workflow; this job only pushes what can be fixed.
      - name: Apply Vite+ fixes
        continue-on-error: true
        run: nix develop --command vp check --fix
      - name: Apply treefmt fixes
        continue-on-error: true
        run: nix develop --command nix fmt
      # autofix.ci rejects the whole fix if it touches a path under .github.
      - name: Drop changes under .github
        run: git restore --worktree -- .github
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
          commit-message: "chore: autofix"
