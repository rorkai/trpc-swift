name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-
      - run: nix develop --command just install
      # Unfixable errors are reported by the CI workflow; this job only pushes what can be fixed.
      - name: Apply Vite+ fixes
        continue-on-error: true
        run: nix develop --command vp check --fix
      - name: Apply treefmt fixes
        continue-on-error: true
        run: nix develop --command nix fmt
      # autofix.ci rejects the whole fix if it touches a path under .github.
      - name: Drop changes under .github
        run: git restore --worktree -- .github
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
          commit-message: "chore: autofix"
