name: tagpr

on:
  push:
    branches:
      - main
  # Toggling tagpr:minor / tagpr:major labels on the release PR updates its
  # proposed version right away instead of on the next push to main.
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

jobs:
  tagpr:
    # Label events only matter on tagpr's own release PR.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      pull_request: ${{ steps.tagpr.outputs.pull_request }}
    steps:
      # persist-credentials stays on so tagpr can push the release PR and the
      # tag; ref: main because tagpr always works on the release branch, not
      # on a pull_request event's merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release PR pushed with GITHUB_TOKEN triggers no pull_request workflows,
  # so CI is dispatched on its branch explicitly.
  ci:
    needs: tagpr
    if: needs.tagpr.outputs.tag == '' && needs.tagpr.outputs.pull_request != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ fromJSON(needs.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
