name: pkg.pr.new

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
      - run: nix profile install --inputs-from . nixpkgs#just nixpkgs#nodejs_24 .#pnpm .#vp
      - run: vp install --frozen-lockfile
      - run: just build
      # pkg.pr.new authorises the upload through its GitHub App, so no token is
      # passed. --pnpm packs as `just publish` does; --no-template drops the
      # StackBlitz template, which cannot run the native tsrs binary.
      - run: pnpm exec pkg-pr-new publish --pnpm --bin --no-template
